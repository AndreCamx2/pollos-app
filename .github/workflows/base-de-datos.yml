name: Base de datos

on:
  push:
    paths: ['supabase/**', '.github/workflows/base-de-datos.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/base-de-datos.yml']

jobs:
  reglas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones y probar las reglas
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/imitar_supabase.sql
          for migracion in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$migracion"
          done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/reglas_del_negocio.sql
